<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar nova senha</title>
    <link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="screen-wrapper">
    <div class="card-box">

        <img src="imgs/logo.png" class="logo-img">

        <h2 class="title">Crie sua nova senha!</h2>

        <form id="resetForm">
            <input type="password" id="newpass" class="input" placeholder="Digite sua senha nova" required>
            <input type="password" id="confirm" class="input" placeholder="Confirme sua senha" required>

            <button class="btn" type="submit">Salvar nova senha</button>
        </form>

        <a href="login.html" class="link">Voltar para o login</a>

    </div>
</div>

<script src="redefinir_senha.js"></script>
</body>
</html>
