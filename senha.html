<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha</title>
    <link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="screen-wrapper">
    <div class="card-box">

        <img src="imgs/logo.png" class="logo-img">

        <h2 class="title">Esqueceu a senha</h2>
        <p class="subtitle">Escreva seu e-mail, para resetar a senha</p>

        <form id="senhaForm">
            <input type="email" id="email" class="input" placeholder="Digite seu email educacional / corporativo" required>

            <button class="btn" type="submit">Resete a senha</button>
        </form>

        <a href="login.html" class="link">Volte para o login</a>

    </div>
</div>

<script src="senha.js"></script>
</body>
</html>
